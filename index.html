<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- APP:START -->
<title>Prontuário ITASUL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: black brand band with a red diagonal, then a monthly board of employee cards;
   the evaluation form mirrors the paper prontuário's numbered sections 1–8. */
:root {
  --bg: #f2f1f2;
  --surface: #ffffff;
  --surface-2: #f7f6f7;
  --ink: #17161a;
  --muted: #66636b;
  --line: #e1dee1;
  --line-strong: #c9c5ca;
  --red: #d71920;
  --red-ink: #b0131a;
  --red-soft: #fdecec;
  --yellow: #ffd21f;
  --band: #141316;
  --band-ink: #ffffff;
  --good: #1d7f47;
  --good-soft: #e5f4eb;
  --warn: #a86f00;
  --warn-soft: #fff4d6;
  --bad: #c0262d;
  --bad-soft: #fde9ea;
  --info: #1f5fbf;
  --info-soft: #e7effb;
  --shadow: 0 1px 2px rgba(20,19,22,.06), 0 4px 14px rgba(20,19,22,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111013; --surface: #1b1a1e; --surface-2: #222125; --ink: #f1eff2; --muted: #a3a0a8;
    --line: #2e2c32; --line-strong: #3d3a41; --red: #ec2b32; --red-ink: #ff6b70; --red-soft: #3a1618;
    --yellow: #ffd21f; --band: #0b0a0c; --band-ink: #ffffff;
    --good: #4cc584; --good-soft: #14301f; --warn: #f0b93a; --warn-soft: #33280d;
    --bad: #ff6b70; --bad-soft: #3a1618; --info: #7aa9ff; --info-soft: #17243a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111013; --surface: #1b1a1e; --surface-2: #222125; --ink: #f1eff2; --muted: #a3a0a8;
  --line: #2e2c32; --line-strong: #3d3a41; --red: #ec2b32; --red-ink: #ff6b70; --red-soft: #3a1618;
  --yellow: #ffd21f; --band: #0b0a0c; --band-ink: #ffffff;
  --good: #4cc584; --good-soft: #14301f; --warn: #f0b93a; --warn-soft: #33280d;
  --bad: #ff6b70; --bad-soft: #3a1618; --info: #7aa9ff; --info-soft: #17243a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.1; text-wrap: balance; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Top band ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--band); color: var(--band-ink);
  overflow: hidden;
}
.topbar::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: min(46vw, 420px);
  background: var(--red); clip-path: polygon(0 0, 100% 0, calc(100% - 46px) 100%, 0 100%);
}
.topbar::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: var(--yellow);
}
.topbar .wrap { position: relative; display: flex; align-items: center; gap: 16px; padding-block: 12px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.brand-txt b { font: 800 21px/1 var(--f-display); letter-spacing: .04em; }
.brand-txt span { font: 600 12px/1.2 var(--f-display); letter-spacing: .14em; text-transform: uppercase; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.sync {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.18); font-size: 12.5px; font-weight: 600; white-space: nowrap; color: #fff;
}
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #9a979d; }
.sync[data-s="cloud"] .dot { background: #4cc584; box-shadow: 0 0 0 3px rgba(76,197,132,.2); }
.sync[data-s="saving"] .dot { background: var(--yellow); }
.sync[data-s="local"] .dot { background: var(--yellow); }
.sync[data-s="error"] .dot { background: #ff6b70; }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; color: #fff; }
.menu > summary::-webkit-details-marker { display: none; }
.menu > summary:hover { background: rgba(255,255,255,.08); }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 240px; padding: 6px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  display: grid; gap: 2px;
}
.menu-pop button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 7px; font-size: 14px; }
.menu-pop button:hover, .menu-pop button:focus-visible { background: var(--surface-2); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu-pop small { color: var(--muted); padding: 4px 10px 6px; font-size: 12px; line-height: 1.35; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 15px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer;
  text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--red-ink); border-color: var(--red-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { all: unset; cursor: pointer; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--red); }

/* ---------- Board (list) ---------- */
main { padding-block: 26px 120px; }
.board-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; margin-bottom: 20px; }
.board-head .ttl { flex: 1 1 320px; min-width: 0; }
.eyebrow { font: 700 12.5px/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--red-ink); }
.board-head h1 { font-size: clamp(30px, 4.2vw, 42px); font-weight: 800; text-transform: uppercase; margin-top: 6px; }
.board-head h1 em { font-style: normal; color: var(--red); }
.board-head p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.month-pick { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.month-pick .lbl { font: 700 19px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; min-width: 148px; text-align: center; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; margin-bottom: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); }
.kpi { padding: 14px 16px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi b { display: block; font: 700 30px/1.1 var(--f-display); margin-top: 4px; }
.kpi b small { font-size: 16px; color: var(--muted); font-weight: 600; }
.podium { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.podium h3 { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.podium ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.podium li { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.podium li .pos { font: 800 15px/1 var(--f-display); color: var(--muted); }
.podium li:first-child .pos { color: var(--red); }
.podium li .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.podium li .pts { font: 700 16px/1 var(--f-display); }
.podium .none { color: var(--muted); font-size: 14px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; padding: 10px 12px 10px 38px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 3px; }
.seg button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--red); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  display: flex; flex-direction: column; min-width: 0; transition: border-color .15s, box-shadow .15s;
}
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.card-top { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; padding: 16px 16px 12px; align-items: start; cursor: pointer; }
.avatar {
  width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center;
  font: 800 18px/1 var(--f-display); letter-spacing: .04em; color: #fff; background: var(--band);
  position: relative; overflow: hidden;
}
.avatar::after { content: ""; position: absolute; right: -8px; bottom: -8px; width: 22px; height: 22px; background: var(--red); transform: rotate(45deg); }
.avatar span { position: relative; z-index: 1; }
.card-id { min-width: 0; }
.card-id h3 { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-id .role { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-contact { display: grid; gap: 4px; padding: 0 16px 12px; font-size: 13.5px; color: var(--muted); }
.card-contact div { display: flex; gap: 8px; align-items: center; min-width: 0; }
.card-contact span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-contact svg.i { width: 15px; height: 15px; }
.card-status { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 64px; }
.score { display: flex; align-items: baseline; gap: 2px; }
.score b { font: 800 30px/1 var(--f-display); }
.score small { color: var(--muted); font-weight: 600; font-size: 13px; }
.card-status .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card-status .meta small { color: var(--muted); font-size: 12.5px; }
.card-status .btn { margin-left: auto; }
.pending { color: var(--muted); font-size: 13.5px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; white-space: nowrap; width: fit-content;
}
.pill.c-exc { background: var(--good-soft); color: var(--good); }
.pill.c-mb { background: var(--good-soft); color: var(--good); }
.pill.c-bom { background: var(--info-soft); color: var(--info); }
.pill.c-pm { background: var(--warn-soft); color: var(--warn); }
.pill.c-ins { background: var(--bad-soft); color: var(--bad); }
.pill.c-none { background: var(--surface-2); color: var(--muted); }
.pill.star { background: var(--yellow); color: #1a1500; }
.flag { position: absolute; }

.empty {
  border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 40px 20px; text-align: center;
  display: grid; justify-items: center; gap: 10px; background: var(--surface);
}
.empty h3 { font-size: 24px; text-transform: uppercase; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

/* ---------- Employee detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
.back:hover { color: var(--ink); }
.profile { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; padding: 20px; align-items: center; margin-bottom: 18px; }
.profile .avatar { width: 64px; height: 64px; font-size: 24px; border-radius: 12px; }
.profile h1 { font-size: clamp(26px, 3.4vw, 34px); font-weight: 800; }
.profile .role { color: var(--muted); margin-top: 2px; }
.profile .contacts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font-size: 14px; }
.profile .contacts div { display: flex; align-items: center; gap: 7px; min-width: 0; }
.profile .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.sec-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 10px; flex-wrap: wrap; }
.sec-title h2 { font-size: 22px; text-transform: uppercase; font-weight: 800; }
.hist { overflow-x: auto; }
.hist table { width: 100%; border-collapse: collapse; min-width: 560px; }
.hist th { text-align: left; font: 700 12.5px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); }
.hist td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.hist tr:last-child td { border-bottom: 0; }
.hist tbody tr { cursor: pointer; }
.hist tbody tr:hover td { background: var(--surface-2); }
.hist .mes { font: 700 17px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.bar { height: 6px; width: 120px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red); border-radius: 3px; }
.trend { padding: 16px 16px 8px; }
.trend svg { width: 100%; height: 150px; display: block; }

/* ---------- Evaluation form ---------- */
.form-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; margin-bottom: 18px; }
.form-head h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; text-transform: uppercase; line-height: 1.02; }
.form-head h1 em { font-style: normal; color: var(--red); }
.form-head .sub { margin-top: 8px; display: inline-block; background: var(--yellow); color: #1a1500; font: 700 14px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px; border-radius: 4px; }
.sheet { display: grid; gap: 16px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.sec-h { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.sec-h .n { background: var(--red); color: #fff; font: 800 22px/1 var(--f-display); display: grid; place-items: center; min-width: 44px; padding: 0 10px; }
.sec-h h2 {
  background: var(--band); color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 10px 34px 10px 14px; clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
  display: flex; align-items: center;
}
.sec-h .aside { margin-left: auto; display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-size: 13px; }
.sec-b { padding: 16px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px 16px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f > span, .f > label { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.f input, .f select, .f textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); min-width: 0;
}
.f textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--red); outline: none; box-shadow: 0 0 0 3px var(--red-soft); }
.f input[readonly] { background: var(--surface-2); color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
.lead { margin: 0; color: var(--muted); max-width: 90ch; }

.crit-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.crits { display: grid; }
.crit { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.crit:first-child { padding-top: 0; }
.crit:last-child { border-bottom: 0; }
.crit .cn { width: 28px; height: 28px; border-radius: 50%; background: var(--band); color: #fff; display: grid; place-items: center; font: 800 15px/1 var(--f-display); }
.crit .cname { font-weight: 700; font-size: 15.5px; }
.crit details { margin-top: 2px; }
.crit summary { cursor: pointer; color: var(--muted); font-size: 13px; width: fit-content; }
.crit summary:hover { color: var(--ink); }
.crit ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { all: unset; cursor: pointer; width: 30px; height: 34px; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--line-strong); color: var(--muted); font-size: 18px; font-weight: 600; }
.stepper button:hover { color: var(--ink); background: var(--surface-2); }
.stepper button:focus-visible { outline: 2px solid var(--red); }
.stepper input { width: 58px; text-align: center; padding: 6px 4px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); font: 700 18px/1.2 var(--f-display); }
.stepper input:focus { border-color: var(--red); outline: none; box-shadow: 0 0 0 3px var(--red-soft); }
.stepper input.bad { border-color: var(--bad); }
.stepper .max { font: 600 14px/1 var(--f-display); color: var(--muted); width: 30px; }
.cbar { grid-column: 2 / -1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: -2px; }
.cbar i { display: block; height: 100%; background: var(--red); width: 0; transition: width .2s; }

.totalbox { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface-2); }
.totalbox .big { padding: 16px; text-align: center; border-bottom: 1px solid var(--line); background: var(--surface); }
.totalbox .big > span:first-child { font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.totalbox .big b { display: block; font: 800 64px/1 var(--f-display); margin-top: 6px; }
.totalbox .big b small { font-size: 24px; color: var(--muted); }
.totalbox .big .pill { margin-top: 8px; }
.totalbox .prog { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.scale { width: 100%; border-collapse: collapse; font-size: 14px; }
.scale th { background: var(--band); color: #fff; font: 700 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px; text-align: left; }
.scale td { padding: 7px 12px; border-top: 1px solid var(--line); }

.occ { display: grid; gap: 14px; }
.occ-h { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; font: 700 14px/1.1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.occ-h.pos { background: var(--good-soft); color: var(--good); }
.occ-h.neg { background: var(--bad-soft); color: var(--bad); }
.occ-h.res { background: var(--info-soft); color: var(--info); }
.occ-h.prov { background: var(--surface-2); color: var(--ink); }
.occ-list { display: grid; gap: 6px; margin-top: 8px; }
.occ-list label { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; font-size: 14px; }
.occ-list input, .occ textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); min-width: 0; }

.occ-list input:focus, .occ textarea:focus { border-color: var(--red); outline: none; box-shadow: 0 0 0 3px var(--red-soft); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
.choices { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.choices > b { font: 700 14px/1.1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.choice { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 2px; font-size: 14.5px; }
.choice input { width: 17px; height: 17px; accent-color: var(--red); margin: 0; flex: none; }

.result { display: grid; gap: 12px; }
.result .tot { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; background: var(--red-soft); border-radius: 8px; padding: 12px 14px; }
.result .tot span { font-weight: 700; }
.result .tot b { font: 800 30px/1 var(--f-display); }
.result .tot b small { color: var(--muted); font-size: 18px; }

.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.06);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.actionbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
.actionbar .state { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
.actionbar .state b { font: 800 22px/1 var(--f-display); color: var(--ink); }
.actionbar .state .dirty { color: var(--warn); font-weight: 700; }

/* ---------- Dialogs & toast ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(12,11,13,.55); }
.dlg-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-size: 22px; text-transform: uppercase; font-weight: 800; }
.dlg-h .icon-btn { margin-left: auto; }
.dlg-b { padding: 18px; display: grid; gap: 12px; }
.dlg-b p { margin: 0; color: var(--muted); }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 50; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 11px 14px; border-radius: 9px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: tin .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes tin { from { transform: translateY(8px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .crit-wrap { grid-template-columns: 1fr; }
  .totalbox { position: static; }
}
@media (max-width: 640px) {

  .brand-txt span { display: none; }
  .sync .txt { display: none; }

  .profile .acts { grid-column: 1 / -1; justify-content: flex-start; }

  .sec-h h2 { font-size: 15px; }
  .sec-h .aside { display: none; }
  .month-pick { width: 100%; justify-content: space-between; }
  .actionbar .btn .t { display: none; }
}

.pdf {

/* ============ Storage ============ */
const LS_KEY = 'itasul-prontuario-v1';
const S = { mode: 'boot', readOnly: false, funcs: new Map(), avals: new Map(), ready: false };
let db = null;
let pending = 0;

function lsLoad() {
  try { const raw = localStorage.getItem(LS_KEY); if (!raw) return; const d = JSON.parse(raw);
    Object.values(d.funcionarios || {}).forEach(f => S.funcs.set(f.id, f));
    Object.values(d.avaliacoes || {}).forEach(a => S.avals.set(a.id, a));
  } catch (e) { /* storage blocked: start empty */ }
}
function lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ funcionarios: Object.fromEntries(S.funcs), avaliacoes: Object.fromEntries(S.avals) })); return true; }
  catch (e) { toast('Não foi possível salvar neste navegador. Exporte um backup para não perder os dados.', true); return false; }
}

function setSync(state, text) {
  const el = $('#sync'); el.dataset.s = state; $('.txt', el).textContent = text;
}
function refreshSync() {
  if (S.mode === 'cloud') {
    if (pending > 0) setSync('saving', 'Salvando…');
    else if (S.readOnly) setSync('local', 'Somente leitura');
    else setSync('cloud', 'Salvo na nuvem');
    $('#menuNote').textContent = 'Os dados ficam salvos online e aparecem para todos que têm acesso a este app.';
  } else {
    setSync('local', 'Salvo neste navegador');
    $('#menuNote').textContent = 'Os dados estão salvos apenas neste navegador. Exporte um backup regularmente ou abra o app publicado para salvar online.';
  }
}

async function cloudWrite(fn) {
  pending++; refreshSync();
  try { await fn(); return true; }
  catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { await fn(); return true; } catch (e2) { e = e2; } }
    if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) { S.readOnly = true; toast('Você tem acesso somente leitura. Peça ao responsável permissão de edição.', true); }
    else if (e && e.code === 'quota_exceeded') toast('O limite de armazenamento foi atingido. Exclua avaliações antigas para liberar espaço.', true);
    else toast('Não foi possível salvar agora. Verifique a conexão e tente de novo.', true);
    return false;
  } finally { pending--; refreshSync(); }
}

const Store = {
  async saveFunc(f) {
    f.atualizadoEm = new Date().toISOString();
    if (S.mode === 'cloud') { const ok = await cloudWrite(() => db.collection('funcionarios').doc(f.id).set(f)); if (ok) S.funcs.set(f.id, f); return ok; }
    S.funcs.set(f.id, f); return lsSave();
  },
  async saveAval(a) {
    a.atualizadoEm = new Date().toISOString(); a.total = totalOf(a);
    if (S.mode === 'cloud') { const ok = await cloudWrite(() => db.collection('avaliacoes').doc(a.id).set(a)); if (ok) S.avals.set(a.id, a); return ok; }
    S.avals.set(a.id, a); return lsSave();
  },
  async delAval(id) {
    if (S.mode === 'cloud') { const ok = await cloudWrite(() => db.collection('avaliacoes').doc(id).delete()); if (ok) S.avals.delete(id); return ok; }
    S.avals.delete(id); return lsSave();
  },
  async delFunc(id) {
    const avs = [...S.avals.values()].filter(a => a.funcionarioId === id);
    for (const a of avs) { if (!(await Store.delAval(a.id))) return false; }
    if (S.mode === 'cloud') { const ok = await cloudWrite(() => db.collection('funcionarios').doc(id).delete()); if (ok) S.funcs.delete(id); return ok; }
    S.funcs.delete(id); return lsSave();
  },
};

async function boot() {
  const hasRuntime = typeof window.claude?.use === 'function';
  if (hasRuntime) {
    setSync('saving', 'Conectando…');
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
  }
  if (!db) { S.mode = 'local'; lsLoad(); S.ready = true; refreshSync(); route(); return; }
  S.mode = 'cloud'; refreshSync();
  window.claude.use('user').then(async u => { if (!u) return; try { if ((await u.can('data.write')) === false) { S.readOnly = true; refreshSync(); route(); } } catch (e) {} });
  let gotF = false, gotA = false;
  const onErr = () => { setSync('error', 'Sem conexão'); toast('A conexão com a nuvem caiu. Recarregue a página para continuar.', true); };
  const done = () => { if (gotF && gotA) { S.ready = true; onDataChange(); } };
  db.collection('funcionarios').onSnapshot(snap => {
    S.funcs = new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }])); gotF = true; done();
  }, onErr);
  db.collection('avaliacoes').onSnapshot(snap => {
    S.avals = new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }])); gotA = true; done();
  }, onErr);
}

/* Re-render on remote changes, but never clobber a form being edited. */
function onDataChange() {
  if (!S.ready) return;
  if (current.view === 'aval') return;
  if ($('dialog[open]')) return;
  route(true);
}

/* ============ Toast & confirm ============ */
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), bad ? 5200 : 2800);
}
function confirmBox(title, text, yes = 'Confirmar', danger = true) {
  const d = $('#dlgConfirm');
  $('#dcTitle').textContent = title; $('#dcText').textContent = text; $('#dcYes').textContent = yes;
  $('#dcYes').className = 'btn ' + (danger ? 'primary' : 'dark');

    $('#dcYes').onclick = () => close(true); $('#dcNo').onclick = () => close(false); d.oncancel = (e) => { e.preventDefault(); close(false); };

/* ============ Routing ============ */
let current = { view: 'list' };
let boardMonth = thisMonth();
let boardFilter = 'todos';
let boardQuery = '';
let dirty = false;

function parseHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('f-')) return { view: 'func', id: h.slice(2) };
  if (h.startsWith('a-')) return { view: 'aval', id: h.slice(2) };
  if (h.startsWith('nova-')) return { view: 'aval', novo: true, fid: h.slice(5) };
  return { view: 'list' };
}
function go(hash) { if (location.hash === '#' + hash || (!hash && !location.hash)) { route(); } else location.hash = hash; }
window.addEventListener('hashchange', async () => {
  if (dirty && current.view === 'aval') {
    const target = location.hash;
    history.replaceState(null, '', current.hash || '#');
    if (await confirmBox('Descartar alterações?', 'Esta avaliação tem alterações que ainda não foram salvas.', 'Descartar')) { dirty = false; location.hash = target; }
    return;
  }
  route();
});
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

function route(keepScroll) {
  if (!S.ready) return;
  const r = parseHash(); r.hash = location.hash;
  current = r; dirty = false;
  if (!keepScroll) window.scrollTo(0, 0);
  if (r.view === 'func') return S.funcs.has(r.id) ? renderFunc(r.id) : notFound();
  if (r.view === 'aval') {
    if (r.novo) return S.funcs.has(r.fid) ? renderAval(newAval(r.fid), true) : notFound();
    const a = S.avals.get(r.id); return a && S.funcs.has(a.funcionarioId) ? renderAval(structuredClone(a), false) : notFound();
  }
  renderList();
}
function notFound() {
  $('#view').innerHTML = `<div class="empty"><h3>Registro não encontrado</h3><p>Ele pode ter sido excluído por outra pessoa.</p><a class="btn" href="#">Voltar para a lista</a></div>`;

}

function drawCards() {

    const a = avalOf(f.id, boardMonth);
    if (boardFilter === 'pendentes' && a) return false;
    if (boardFilter === 'avaliados' && !a) return false;

  const g = $('#grid');

function trendSvg(list) {
  const W = 1000, H = 150, L = 36, R = 16, T = 14, B = 26;
  const xs = (i) => L + (list.length === 1 ? 0 : i * (W - L - R) / (list.length - 1));
  const ys = (v) => T + (100 - v) * (H - T - B) / 100;
  const pts = list.map((a, i) => [xs(i), ys(totalOf(a))]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1][0]} ${ys(0)} L${pts[0][0]} ${ys(0)} Z`;
  const grid = [0, 60, 80, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${ys(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`).join('');
  const step = Math.ceil(list.length / 8);
  const labels = list.map((a, i) => i % step === 0 || i === list.length - 1 ? `<text x="${xs(i)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(mesLabel(a.mes, true))}</text>` : '').join('');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Pontuação por mês">
    ${grid}<path d="${area}" fill="var(--red)" fill-opacity=".1"/><path d="${line}" fill="none" stroke="var(--red)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--surface)" stroke="var(--red)" stroke-width="2"/>`).join('')}
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--red)"/>${labels}</svg>`;
}

function lastGestor() {
  const l = [...S.avals.values()].sort((a, b) => (b.atualizadoEm || '').localeCompare(a.atualizadoEm || ''))[0];

const getP = (o, p) => p.split('.').reduce((x, k) => x?.[k], o);
const setP = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((x, k) => (x[k] ??= (/^\d+$/.test(k) ? [] : {})), o); t[last] = v; };

function fld(path, label, opts = {}) {
  const id = 'av-' + path.replace(/\./g, '-');

  if (opts.area) return `<div class="f ${opts.full ? 'full' : ''}"><label for="${id}">${label}</label><textarea id="${id}" data-k="${path}" rows="${opts.rows || 2}"${ro}>${esc(v)}</textarea></div>`;
  return `<div class="f ${opts.full ? 'full' : ''}"><label for="${id}">${label}</label><input id="${id}" data-k="${path}" type="${opts.type || 'text'}" value="${esc(v)}"${ro}${opts.ph ? ` placeholder="${esc(opts.ph)}"` : ''}></div>`;
}
function radios(path, options, title) {
  const v = getP(A, path) || '';
  return `<div class="choices" role="radiogroup" aria-label="${esc(title)}"><b>${esc(title)}</b>${options.map(([k, l]) => `

}
function secH(n, title, aside = '') {

function markDirty() {
  dirty = true; const s = $('#barState'); if (s) { s.textContent = 'Alterações não salvas'; s.className = 'dirty'; }
}
function onFormInput(e) {
  const t = e.target;
  if (S.readOnly) return;
  if (t.dataset.nota) {
    const c = CRITERIOS.find(x => x.k === t.dataset.nota);
    const raw = t.value.replace(',', '.').trim();
    const v = num(raw);
    t.classList.toggle('bad', raw !== '' && (v == null || v < 0 || v > c.max));
    A.notas[c.k] = (v == null || v < 0 || v > c.max) ? (raw === '' ? null : A.notas[c.k]) : v;
    if (e.type === 'change' && v != null) { const cl = Math.max(0, Math.min(c.max, v)); A.notas[c.k] = cl; t.value = cl; t.classList.remove('bad'); }
    if (e.type === 'change' && raw !== '' && v == null) { t.value = A.notas[c.k] ?? ''; t.classList.remove('bad'); }
    updateTotals(); markDirty(); return;
  }
  if (t.id === 'av-mes-m' || t.id === 'av-mes-y') { A.mes = `${$('#av-mes-y').value}-${$('#av-mes-m').value}`; markDirty(); return; }
  if (t.dataset.k) {
    if (t.type === 'radio') { if (t.checked) setP(A, t.dataset.k, t.value); }
    else setP(A, t.dataset.k, t.value);
    markDirty();
  }
}
function step(k, d) {
  const c = CRITERIOS.find(x => x.k === k);
  const cur = num(A.notas[k]);
  const next = cur == null ? (d > 0 ? c.max : 0) : Math.max(0, Math.min(c.max, cur + d));
  A.notas[k] = next; const inp = $('#nt-' + k); inp.value = next; inp.classList.remove('bad');
  updateTotals(); markDirty();
}
function updateTotals() {
  const t = totalOf(A), c = classif(t), n = filledOf(A);
  CRITERIOS.forEach(cr => { const v = num(A.notas[cr.k]); const b = $('#cb-' + cr.k); if (b) b.style.width = (v == null ? 0 : v / cr.max * 100) + '%'; });
  $('#totN').textContent = fmtN(t); $('#totN2').textContent = fmtN(t); $('#barTot').textContent = fmtN(t);
  const pill = $('#totC'); pill.className = 'pill ' + (n ? c.c : 'c-none'); pill.textContent = n ? c.nome : 'Sem notas';
  $('#totP').textContent = n === 8 ? 'Todos os 8 critérios avaliados' : `${n} de 8 critérios avaliados`;
  $$('.scale tr[data-min]').forEach(tr => tr.classList.toggle('on', n > 0 && +tr.dataset.min === c.min));
}

let pdfBusy = false;
async function exportPdf(a) {
  if (pdfBusy) return;
  if (typeof window.html2canvas !== 'function' || !window.jspdf?.jsPDF) { toast('O gerador de PDF não carregou. Verifique a conexão e recarregue a página.', true); return; }
  const f = S.funcs.get(a.funcionarioId);
  pdfBusy = true; toast('Gerando PDF…');
  const host = $('#pdfHost'); host.innerHTML = pdfDoc(f, a);
  const filename = `avaliacao-${slug(f.nome) || 'funcionario'}-${a.mes}.pdf`;
  try {
    if (document.fonts?.ready) await document.fonts.ready;
    const sheet = host.firstElementChild;
    const scale = 2;
    const canvas = await window.html2canvas(sheet, { scale, backgroundColor: '#ffffff', useCORS: true, logging: false, scrollX: 0, scrollY: 0, windowWidth: sheet.offsetWidth });
    // A4 with 8 mm margins; page breaks fall between sections, never inside one.
    const M = 8, PW = 210 - 2 * M, PH = 297 - 2 * M;
    const pxPerMm = canvas.width / PW;
    const pageH = Math.floor(PH * pxPerMm);
    const top = sheet.getBoundingClientRect().top;
    const cuts = [...sheet.querySelectorAll('.pdf-top, .pdf-body > *, .pdf-foot')]
      .map(el => Math.round((el.getBoundingClientRect().bottom - top + 6) * scale)).sort((x, y) => x - y);
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    let y = 0, page = 0;
    while (y < canvas.height - 2) {
      let end = Math.min(canvas.height, y + pageH);
      if (end < canvas.height) { const fit = cuts.filter(c => c > y + 40 && c <= end); if (fit.length) end = fit[fit.length - 1]; }
      const h = end - y;
      const part = document.createElement('canvas'); part.width = canvas.width; part.height = h;
      const ctx = part.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, part.width, h);
      ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (page) pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg', 0.95), 'JPEG', M, M, PW, h / pxPerMm);
      y = end; page++;
    }
    const blob = pdf.output('blob');
    await offerFile(filename, blob);
  } catch (e) {
    console.error(e); toast('Não foi possível gerar o PDF. Tente de novo.', true);
  } finally { host.innerHTML = ''; pdfBusy = false; }
}

async function offerFile(filename, blob) {
  if (typeof window.claude?.use === 'function') {
    const dl = await window.claude.use('downloads');
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast('Arquivo pronto: ' + filename); }
      catch (e) { if (e?.code !== 'declined') toast(e?.code === 'rate_limited' ? 'Já existe um download aguardando confirmação.' : 'O download não está disponível nesta visualização.', true); }
      return;
    }
  }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Arquivo baixado: ' + filename);
}

/* ============ Backup ============ */
async function exportBackup() {
  const data = { app: 'prontuario-itasul', versao: 1, exportadoEm: new Date().toISOString(), funcionarios: [...S.funcs.values()], avaliacoes: [...S.avals.values()] };
  await offerFile(`backup-avaliacoes-itasul-${today()}.json`, new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
}
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (er) { toast('Este arquivo não é um backup válido (.json).', true); return; }
  const fs = Array.isArray(data.funcionarios) ? data.funcionarios.filter(x => x && x.id && x.nome) : [];
  const as = Array.isArray(data.avaliacoes) ? data.avaliacoes.filter(x => x && x.id && x.funcionarioId && x.mes) : [];
  if (!fs.length) { toast('O backup não contém funcionários.', true); return; }
  if (!(await confirmBox('Importar backup?', `Serão importados ${fs.length} funcionário(s) e ${as.length} avaliação(ões). Registros com o mesmo identificador serão substituídos.`, 'Importar', false))) return;
  let ok = true;
  for (const f of fs) { if (!(await Store.saveFunc({ ...f }))) { ok = false; break; } }
  if (ok) for (const a of as) { if (!(await Store.saveAval({ ...a }))) { ok = false; break; } }
  toast(ok ? 'Backup importado' : 'A importação parou no meio. Tente de novo.', !ok);
  route();
});

/* ============ Global events ============ */
document.addEventListener('click', async (e) => {
  const stepBtn = e.target.closest('[data-step]');
  if (stepBtn) { step(stepBtn.dataset.c, +stepBtn.dataset.step); return; }
  const open = e.target.closest('[data-open]');
  if (open) { go('f-' + open.dataset.open); return; }
  const row = e.target.closest('tr[data-go]');
  if (row && !e.target.closest('[data-act]')) { go(row.dataset.go); return; }
  const fb = e.target.closest('[data-filter]');
  if (fb) { boardFilter = fb.dataset.filter; $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b === fb)); drawCards(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act !== 'backup-export' && act !== 'backup-import') $('#menu').open = false;
  switch (act) {
    case 'mes-prev': boardMonth = shiftMonth(boardMonth, -1); renderList(); break;
    case 'mes-next': boardMonth = shiftMonth(boardMonth, 1); renderList(); break;
    case 'novo-func': openFuncDialog(); break;
    case 'edit-func': openFuncDialog(el.dataset.id); break;
    case 'del-func': {
      const f = S.funcs.get(el.dataset.id); const n = avalsOf(f.id).length;
      if (await confirmBox('Excluir funcionário?', `${f.nome} e ${n === 1 ? 'sua avaliação' : `suas ${n} avaliações`} serão excluídos definitivamente.`, 'Excluir')) {
        if (await Store.delFunc(f.id)) { toast('Funcionário excluído'); go(''); }
      } break;
    }
    case 'avaliar': go('nova-' + el.dataset.id); break;
    case 'save-aval': saveAval(); break;
    case 'del-aval': {
      if (await confirmBox('Excluir avaliação?', `A avaliação de ${mesLabel(A.mes)} será excluída definitivamente.`, 'Excluir')) {
        if (await Store.delAval(A.id)) { dirty = false; toast('Avaliação excluída'); go('f-' + A.funcionarioId); }
      } break;
    }
    case 'pdf': exportPdf(structuredClone(A)); break;
    case 'pdf-row': { const a = S.avals.get(el.dataset.id); if (a) exportPdf(a); break; }
    case 'backup-export': $('#menu').open = false; exportBackup(); break;
    case 'backup-import': $('#menu').open = false; if (S.readOnly) { toast('Você tem acesso somente leitura.', true); break; } $('#importFile').click(); break;
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && current.view === 'aval') { e.preventDefault(); saveAval(); }
  if (e.key === 'Enter' && e.target.matches('[data-open]')) go('f-' + e.target.dataset.open);
  if (e.key === 'Enter' && e.target.matches('#avForm input')) e.preventDefault();
});
document.addEventListener('click', (e) => { const m = $('#menu'); if (m.open && !m.contains(e.target)) m.open = false; });

boot();
})();
</script>
